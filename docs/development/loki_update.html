<div class="normal">
The Loki Update Tool is a tool written by Loki Software, Inc., designed to be used in conjunction with their setup and patch tools to easily update products.
</div>

<div class="small">
This end-user tool allows anyone to quickly and easily update any Loki software they install.  It features easy-to-use mirror support, the ability to resume broken connections, support for HTTP and FTP proxies, and automatic update verification to make absolutely sure that the download you want is the download you get. 
</div>

<div class="small">
The Loki Update Tool is offered under the GNU General Public License (GPL).
</div>

<div class="small">
We hope that by making this tool available to the open source community that others will be able to use it for their own products, and that this tool can be expanded and enhanced for everyone's benefit.
</div>
