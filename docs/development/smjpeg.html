<div class="normal">
Our third Open Source project is the SDL Motion JPEG Library (SMJPEG). Be sure to return to this site for news and updates as the project progresses. 
</div>

<div class="small">
SMPEG is based on a modified version of the Independent JPEG Group's
library for JPEG image manipulation and freely available source code
for ADPCM audio compression.  Based on our initial work, SMJPEG is able
to create and display motion JPEG files in a custom open format.
</div>

<div class="small">
Advantages of SMJPEG:
</div>

<UL>
	<LI><span class="small">Arbitrary video sizes (not limited to blocks of 16 pixels)</span></LI>
	<LI><span class="small">Arbitrary frame-rate</span></LI>
	<LI><span class="small">User-tuneable compression level</span></LI>
	<LI><span class="small">Much easier to skip a frame</span></LI>
	<LI><span class="small">Much easier to keep timesync</span></LI>
	<LI><span class="small">Easy to seek within the video stream</span></LI>
	<LI><span class="small">Free of patent problems</span></LI>
</UL>

<div class="small">
Disadvantages of SMJPEG:
</div>

<UL>
	<LI><span class="small">Not a standard format</span></LI>
	<LI><span class="small">Poorer quality than MPEG at the same file size</span></LI>
	<LI><span class="small">Slightly slower than MPEG at the same framerate</span></LI>
	<LI><span class="small">Not designed for Internet streaming</span></LI>
</UL>

<div class="small">
The SMJPEG file format is documented in the file <A HREF="download/smjpeg/SMJPEG.txt">SMJPEG.txt</A>.
</div>

<div class="small">
SMJPEG is offered under the GNU Library Public License (LGPL). We hope that by making this tool available to the open source community that others will be able to use it for their own products, and improve upon it for everyone's benefit.
</div>

<h2>
xanim Extension
</h2>

<div class="small">
In addition to SMJPEG, we also have on tap an extension of the original exporting version of xanim, written by Mark Podlipec and modified by Adam Williams. In addition to exporting to QuickTime format, this version also exports JPEG and PPM frames, along with 16-bit mono audio streams. This is the tool that we use to create Motion JPEG movies for our games.
</div>

<div class="small">
For more information and documentation, please read the accompanying <A HREF="download/smjpeg/README.xanim.txt">readme file</A>.
</div>
