Our first Open Source project is the SDL MPEG Player Library (SMPEG). Be sure to return to this site for news and updates as the project progresses.
<?php echo $_text_normal ?>

<?php echo $text_small ?>
SMPEG is based on UC Berkeley's <TT>mpeg_play</TT> software MPEG decoder and SPLAY, an mpeg audio decoder created by Woo-jae Jung. We have completed the initial work to wed these two projects in order to create a general purpose MPEG video/audio player for the Linux OS. Based on our initial work, SMPEG is able to playback MPEG video with sound on Pentium II based systems. SMPEG does not achieve adequate performance on slower systems.
<?php echo $_text_small ?>

<?php echo $text_small ?>
SMPEG is offered under the GNU Library Public License (LGPL).
<?php echo $_text_small ?>

<?php echo $text_small ?>
